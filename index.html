<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realistic 3D Endless Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: min(100vw, calc(100vh * (9 / 16)));
            height: min(100vh, calc(100vw * (16 / 9)));
            background: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }
        #game-over-screen h1 {
            font-size: 36px;
            color: #ff3838;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        #game-over-screen p {
            font-size: 20px;
            margin: 6px 0;
            color: #dcdde1;
        }
        #restart-btn {
            margin-top: 30px;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #00a8ff, #0097e6);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,168,255,0.4);
            transition: all 0.2s;
        }
        #restart-btn:active {
            transform: scale(0.95);
        }
        .hidden {
            display: none !important;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div>🪙 <span id="score">0</span></div>
            <div>🛣️ <span id="distance">0</span>m</div>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1>BUSTED</h1>
            <p>Coins: <span id="final-score">0</span></p>
            <p>Distance: <span id="final-distance">0</span>m</p>
            <button id="restart-btn" onclick="restartGame()">DRIVE AGAIN</button>
        </div>
    </div>

<script>
// --- PROCEDURAL TEXTURE GENERATOR ---
function createAsphaltTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#222225';
    ctx.fillRect(0, 0, 512, 512);

    // Noise for texture
    for (let i = 0; i < 30000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const val = Math.random() * 40;
        ctx.fillStyle = `rgb(${val+30},${val+30},${val+35})`;
        ctx.fillRect(x, y, 2, 2);
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(1, 10);
    return texture;
}

// --- GAME SETTINGS ---
const LANES = [-2.4, 0, 2.4];
let currentLane = 1;

let isJumping = false;
let jumpVelocity = 0;
const gravity = 0.018;
let playerY = 0.5;

let baseSpeed = 0.45;
let speed = baseSpeed;
let score = 0;
let distance = 0;
let isGameOver = false;

// --- THREE.JS SCENE ---
const container = document.getElementById('game-container');
const scene = new THREE.Scene();

const skyColor = new THREE.Color(0x4a69bd);
scene.background = skyColor;
scene.fog = new THREE.FogExp2(0x6a89cc, 0.015);

const camera = new THREE.PerspectiveCamera(55, 9 / 16, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// --- LIGHTING ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffaed, 1.5);
sunLight.position.set(30, 50, -20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
scene.add(sunLight);

// --- POLICE CAR PLAYER ---
const playerGroup = new THREE.Group();

// Car Body
const carBody = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.6, 2.8),
    new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 })
);
carBody.position.y = 0.4;
carBody.castShadow = true;
playerGroup.add(carBody);

// White Doors (Police style)
const door = new THREE.Mesh(
    new THREE.BoxGeometry(1.42, 0.55, 1.2),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
);
door.position.set(0, 0.42, 0);
playerGroup.add(door);

// Roof / Glass
const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 0.5, 1.4),
    new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.9 })
);
cabin.position.set(0, 0.85, -0.2);
playerGroup.add(cabin);

// Police Siren Lightbar
const sirenBase = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.1, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
);
sirenBase.position.set(0, 1.15, -0.2);

const redSiren = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.12, 0.18),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
redSiren.position.set(-0.25, 1.16, -0.2);

const blueSiren = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.12, 0.18),
    new THREE.MeshBasicMaterial({ color: 0x00a8ff })
);
blueSiren.position.set(0.25, 1.16, -0.2);

playerGroup.add(sirenBase, redSiren, blueSiren);

// Wheels
const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.25, 16);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
const wPos = [[-0.7, 0.3, 0.9], [0.7, 0.3, 0.9], [-0.7, 0.3, -0.9], [0.7, 0.3, -0.9]];
wPos.forEach(p => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(...p);
    w.castShadow = true;
    playerGroup.add(w);
});

playerGroup.position.set(LANES[currentLane], playerY, 0);
scene.add(playerGroup);

// --- WORLD GENERATION ---
const asphaltTex = createAsphaltTexture();
const roadMaterial = new THREE.MeshStandardMaterial({
    map: asphaltTex,
    roughness: 0.3, // Wet Road feel
    metalness: 0.1
});

const chunkLength = 50;
const chunks = [];
let obstacles = [];
let coins = [];

function spawnItems(zPos) {
    for (let z = -chunkLength / 2; z < chunkLength / 2; z += 15) {
        if (Math.random() > 0.25) {
            const lane = Math.floor(Math.random() * 3);
            const rand = Math.random();

            if (rand < 0.5) {
                // Traffic Car / Red Bus
                const car = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 1.2, 3),
                    new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.3 })
                );
                car.position.set(LANES[lane], 0.6, zPos + z);
                car.castShadow = true;
                scene.add(car);
                obstacles.push(car);
            } else {
                // Gold Coin
                const coin = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.45, 0.45, 0.12, 20),
                    new THREE.MeshStandardMaterial({ color: 0xfbc531, metalness: 0.9, roughness: 0.1 })
                );
                coin.rotation.x = Math.PI / 2;
                coin.position.set(LANES[lane], 0.8, zPos + z);
                scene.add(coin);
                coins.push(coin);
            }
        }
    }
}

function createChunk(zPos) {
    const chunk = new THREE.Group();
    chunk.position.z = zPos;

    // Road Plane
    const road = new THREE.Mesh(new THREE.PlaneGeometry(9, chunkLength), roadMaterial);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    chunk.add(road);

    // Sidewalks
    [-5, 5].forEach(x => {
        const sw = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 0.3, chunkLength),
            new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.6 })
        );
        sw.position.set(x, 0.15, 0);
        sw.receiveShadow = true;
        chunk.add(sw);
    });

    // Lane Dividers
    for (let z = -chunkLength / 2; z < chunkLength / 2; z += 5) {
        [-1.2, 1.2].forEach(x => {
            const line = new THREE.Mesh(
                new THREE.PlaneGeometry(0.18, 2.5),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            line.rotation.x = -Math.PI / 2;
            line.position.set(x, 0.02, z);
            chunk.add(line);
        });
    }

    // Modern Buildings
    for (let z = -chunkLength / 2 + 6; z < chunkLength / 2; z += 16) {
        [-9, 9].forEach(x => {
            const h = 12 + Math.random() * 15;
            const b = new THREE.Mesh(
                new THREE.BoxGeometry(6, h, 12),
                new THREE.MeshStandardMaterial({ 
                    color: [0x2c3e50, 0x34495e, 0x7f8c8d, 0x1e272e][Math.floor(Math.random()*4)],
                    roughness: 0.2,
                    metalness: 0.5
                })
            );
            b.position.set(x, h / 2, z);
            b.castShadow = true;
            chunk.add(b);
        });
    }

    scene.add(chunk);
    chunks.push(chunk);

    if (zPos < -20) spawnItems(zPos);
}

// Initial Spawn
for (let i = 0; i < 4; i++) createChunk(-i * chunkLength);

// --- CONTROLS ---
let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
});
window.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30 && currentLane < 2) currentLane++;
        else if (dx < -30 && currentLane > 0) currentLane--;
    } else if (dy < -30 && !isJumping) {
        isJumping = true;
        jumpVelocity = 0.3;
    }
});
window.addEventListener('keydown', e => {
    if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) currentLane--;
    if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) currentLane++;
    if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping) {
        isJumping = true;
        jumpVelocity = 0.3;
    }
});

// --- ANIMATION LOOP ---
let sirenTimer = 0;
function animate() {
    if (isGameOver) return;
    requestAnimationFrame(animate);

    // Flashing Siren Effect
    sirenTimer += 0.1;
    redSiren.material.color.setHex(Math.sin(sirenTimer) > 0 ? 0xff0000 : 0x220000);
    blueSiren.material.color.setHex(Math.sin(sirenTimer) <= 0 ? 0x00a8ff : 0x001122);

    // Car Motion
    playerGroup.position.x += (LANES[currentLane] - playerGroup.position.x) * 0.25;

    if (isJumping) {
        playerGroup.position.y += jumpVelocity;
        jumpVelocity -= gravity;
        if (playerGroup.position.y <= playerY) {
            playerGroup.position.y = playerY;
            isJumping = false;
        }
    }

    distance += speed * 0.25;
    document.getElementById('distance').innerText = Math.floor(distance);

    // Move Road Chunks
    chunks.forEach(chunk => {
        chunk.position.z += speed;
        if (chunk.position.z > chunkLength) {
            chunk.position.z -= chunkLength * chunks.length;
            spawnItems(chunk.position.z);
        }
    });

    // Obstacle Logic
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += speed;

        const pBox = new THREE.Box3().setFromObject(playerGroup);
        const oBox = new THREE.Box3().setFromObject(obs);

        if (pBox.intersectsBox(oBox)) triggerGameOver();

        if (obs.position.z > 10) {
            scene.remove(obs);
            obstacles.splice(i, 1);
        }
    }

    // Coin Logic
    for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.position.z += speed;
        coin.rotation.z += 0.06;

        const pBox = new THREE.Box3().setFromObject(playerGroup);
        const cBox = new THREE.Box3().setFromObject(coin);

        if (pBox.intersectsBox(cBox)) {
            score += 10;
            document.getElementById('score').innerText = score;
            scene.remove(coin);
            coins.splice(i, 1);
        } else if (coin.position.z > 10) {
            scene.remove(coin);
            coins.splice(i, 1);
        }
    }

    // Camera Chase View
    camera.position.set(playerGroup.position.x * 0.35, 3.2, 5.5);
    camera.lookAt(playerGroup.position.x * 0.35, 1, -12);

    renderer.render(scene, camera);
}

function triggerGameOver() {
    isGameOver = true;
    document.getElementById('final-score').innerText = score;
    document.getElementById('final-distance').innerText = Math.floor(distance);
    document.getElementById('game-over-screen').classList.remove('hidden');
}

function restartGame() {
    isGameOver = false;
    score = 0;
    distance = 0;
    currentLane = 1;
    playerGroup.position.x = LANES[1];
    playerGroup.position.y = playerY;

    document.getElementById('score').innerText = '0';
    document.getElementById('distance').innerText = '0';
    document.getElementById('game-over-screen').classList.add('hidden');

    obstacles.forEach(o => scene.remove(o));
    coins.forEach(c => scene.remove(c));
    obstacles.length = 0;
    coins.length = 0;

    animate();
}

window.addEventListener('resize', () => {
    renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
</script>
</body>
</html>
